<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="img/logo.jpg" type="image/jpg" />
    <title>Juventud Libertaria</title>
  </head>

  <body
    class="min-w-[300px] w-full min-h-screen h-full flex flex-col text-black font-sans bg-gray-200 overflow-x-hidden"
  >
    <header class="w-full h-full font-dm-sans text-white">
      <nav
        class="flex items-center justify-between bg-[#1e1f25] px-4 py-2 h-16"
      >
        <div class="flex items-center space-x-4">
          <a
            href="index.html"
            class="text-2xl md:text-3xl font-bold text-white"
          >
            Juventud<span class="text-[#bdeb00]">Libertaria</span>
          </a>
        </div>

        <ul class="hidden md:flex space-x-6 text-white font-bold">
          <li>
            <a href="index.html" class="hover:text-[#bdeb00]">Inicio</a>
          </li>
          <li>
            <a href="portal.html" class="hover:text-[#bdeb00]">Nosotros</a>
          </li>
          <li>
            <a href="sumarse.html" class="hover:text-[#bdeb00]">Unite!</a>
          </li>
          <li>
            <a href="#Contacto" class="hover:text-[#bdeb00]">Contacto</a>
          </li>
        </ul>

        <div
          class="md:hidden text-black bg-[#bdeb00] p-2 rounded-lg cursor-pointer flex items-center justify-center"
          id="menu-toggle"
        >
          <a href="#hamb">
            <img src="icons/bx-menu.svg" alt="icono-menu" class="w-6 h-6" />
          </a>
        </div>
      </nav>

      <div
        id="mobile-menu"
        class="hidden flex-col bg-[#1e1f25] text-white p-4 rounded-lg space-y-4 md:hidden"
      >
        <a href="index.html" class="hover:text-[#bdeb00]">Inicio</a>
        <a href="nosotros.html" class="hover:text-[#bdeb00]">Nosotros</a>
        <a href="sumarse.html" class="hover:text-[#bdeb00]">Unite!</a>
        <a href="#Contacto" class="hover:text-[#bdeb00]">Contacto</a>
      </div>
    </header>

    <section
      id="home-section"
      class="relative h-screen bg-[#1e1f25] text-center bg-[url('img/background.jpg')] bg-cover bg-center"
    >
      <div class="absolute inset-0 bg-black bg-opacity-60"></div>

      <div
        class="relative h-full flex flex-col justify-center items-center px-4"
      >
        <h1
          class="text-white text-6xl sm:text-7xl md:text-9xl font-bold mb-4 mt-[-180px] drop-shadow-lg"
        >
          UNITE<span class="text-[#bdeb00]">!</span>
        </h1>
        <p
          class="text-white font-medium text-2xl sm:text-3xl md:text-4xl mb-6 max-w-3xl mx-auto"
        >
          Somos el movimiento m√°s grande de la Juventud Liberal.
        </p>
        <a href="sumarse.html">
          <button
            class="bg-[#b0d325]/90 text-black font-bold py-5 px-14 cursor-pointer hover:bg-[#bdeb00] transition duration-300"
          >
            Sumarme
          </button>
        </a>
      </div>
    </section>

    <section
      id="hamb"
      class="flex justify-center items-center bg-[#b0d325]/90 h-40"
    >
      <div
        class="flex justify-around items-center w-full max-w-screen-md space-x-6"
      >
        <div class="flex flex-col items-center space-y-2">
          <a
            href="./portal.html"
            class="bg-gray-200 text-[#bdeb00] rounded-full flex justify-center items-center w-[75px] h-[75px] p-[15px] border-4 border-black transition-transform duration-300 ease-in-out cursor-pointer hover:scale-110"
          >
            <img
              src="icons/hand-up-solid-84.png"
              alt="portal"
              class="w-full h-auto"
            />
          </a>
          <p class="text-black font-bold text-xl">Portal</p>
        </div>

        <div class="flex flex-col items-center space-y-2">
          <a
            href="galeria.html"
            class="bg-gray-200 text-[#bdeb00] rounded-full flex justify-center items-center w-[75px] h-[75px] p-[15px] border-4 border-black transition-transform duration-300 ease-in-out cursor-pointer hover:scale-110"
          >
            <img
              src="icons/camera-solid-84.png"
              alt="galeria"
              class="w-full h-auto"
            />
          </a>
          <p class="text-black font-bold text-xl">Galeria</p>
        </div>

        <div class="flex flex-col items-center space-y-2">
          <a
            href="/tienda.html"
            class="bg-gray-200 text-[#bdeb00] rounded-full flex justify-center items-center w-[75px] h-[75px] p-[15px] border-4 border-black transition-transform duration-300 ease-in-out cursor-pointer hover:scale-110"
          >
            <img
              src="icons/store-regular-84.png"
              alt="tienda"
              class="w-full h-auto"
            />
          </a>
          <p class="text-black font-bold text-xl">Tienda</p>
        </div>
      </div>
    </section>

    <section id="Contacto" class="bg-[#2a2b30] py-16">
      <form class="max-w-screen-md mx-auto p-6 rounded-lg">
        <p class="text-5xl md:text-6xl font-bold text-white mb-6 text-center">
          Contacto<span class="text-[#bdeb00]">!</span>
        </p>
        <div class="form-row grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <div class="form-group">
            <label for="nombre" class="block text-white mb-2 md:text-center"
              >Nombre completo</label
            >
            <input
              type="text"
              id="nombre"
              name="nombre"
              placeholder="Juan Carlos Perez"
              required
              class="w-full p-3 bg-[#3a3d42] rounded-lg text-white"
            />
          </div>

          <div class="form-group">
            <label for="correo" class="block text-white mb-2 md:text-center"
              >Correo electr√≥nico</label
            >
            <input
              type="email"
              id="correo"
              name="correo"
              placeholder="juanperez@correo.com"
              required
              pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
              class="w-full p-3 bg-[#3a3d42] rounded-lg text-white"
            />
          </div>
        </div>

        <div class="mb-6">
          <label for="mensaje" class="block text-white mb-2 md:text-center"
            >Mensaje</label
          >
          <textarea
            id="mensaje"
            name="mensaje"
            placeholder="Escribe tu mensaje..."
            rows="4"
            required
            class="w-full p-3 bg-[#3a3d42] rounded-lg text-white"
          ></textarea>
        </div>

        <button
          type="submit"
          class="bg-[#b0d325]/90 flex justify-center text-black font-bold py-5 px-14 mx-auto cursor-pointer hover:bg-[#bdeb00] transition"
        >
          Enviar
        </button>
      </form>
    </section>

        <footer class="bg-[#1e1f25] py-8 sm:py-10 mt-auto">
      <div class="mx-auto w-full max-w-5xl px-4">
        <div class="flex flex-wrap justify-center gap-4 sm:gap-6 mb-4 sm:mb-6">
          <div
            class="bg-[#3a391b] rounded-full flex justify-center items-center w-10 h-10 sm:w-[45px] sm:h-[45px] p-2 sm:p-[10px] transition-transform duration-300 ease-in-out cursor-pointer hover:scale-110 hover:bg-[#bdeb00]"
          >
            <img
              src="icons/tiktok-logo-48.png"
              alt="«?cono de tiktok"
              class="w-full h-auto"
            />
          </div>

          <div
            class="bg-[#3a391b] rounded-full flex justify-center items-center w-10 h-10 sm:w-[45px] sm:h-[45px] p-2 sm:p-[10px] transition-transform duration-300 ease-in-out cursor-pointer hover:scale-110 hover:bg-[#bdeb00]"
          >
            <img
              src="icons/instagram-logo-48.png"
              alt="«?cono de instagram"
              class="w-full h-auto"
            />
          </div>

          <div
            class="bg-[#3a391b] rounded-full flex justify-center items-center w-10 h-10 sm:w-[45px] sm:h-[45px] p-2 sm:p-[10px] transition-transform duration-300 ease-in-out cursor-pointer hover:scale-110 hover:bg-[#bdeb00]"
          >
            <img
              src="icons/facebook-logo-48.png"
              alt="«?cono de facebook"
              class="w-full h-auto"
            />
          </div>
        </div>

        <p class="text-center text-[#727159] text-sm sm:text-base">
          <strong>&copy; 2024 - todos los derechos reservados</strong>
        </p>
      </div>
    </footer>
  </body>
</html>
